<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Comment Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>LinkedIn Comment Generator</h2>
  <textarea id="postText" placeholder="Paste LinkedIn post here..."></textarea>
  
  <label for="tone">Tone:</label>
  <select id="tone">
    <option>Professional</option>
    <option>Friendly</option>
    <option>Supportive</option>
    <option>Engaging</option>
    <option>Enthusiastic</option>
    <option>Curious</option>
  </select>

  <label for="length">Length:</label>
  <select id="length">
    <option value="short">Short</option>
    <option value="medium" selected>Medium</option>
    <option value="long">Long</option>
  </select>

  <label for="numComments">Number of Comments:</label>
  <select id="numComments">
    <option>4</option>
    <option selected>5</option>
  </select>

  <label for="model">Model:</label>
  <select id="model">
    <option>gpt-4o-mini</option>
    <option>deepseek/deepseek-chat-v3.1:free</option>
    <option>anthropic/claude-3.5-sonnet</option>
  </select>

  <button id="generateBtn">✨ Generate Comments</button>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
